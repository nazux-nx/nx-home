<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nazux</title>
<meta name="description" content="Nazux: plain explainers for a calmer home office.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Nunito, "Varela Round", Quicksand, sans-serif;
    background: linear-gradient(115deg, #172647 0%, #233b6e 100%);
    color: #eff0f4;
  }
  main { width: min(560px, 100%); padding: 2rem 1.5rem; }
  .logo {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .9rem;
    margin: 0 0 1.35rem;
    font-size: inherit;
    font-weight: inherit;
  }
  .mark { width: 4.6rem; height: 4.6rem; flex: none; }
  .wordmark {
    font-weight: 800;
    font-size: 3.35rem;
    letter-spacing: -.03em;
    line-height: 1;
    color: #eff0f4;
  }
  .lede { font-size: 1.1rem; line-height: 1.6; font-weight: 600; color: #d3d6db; text-align: center; margin: 0 0 1.5rem; }
  form { margin: 0; }
  label { display: block; font-size: .95rem; font-weight: 700; margin-bottom: .4rem; color: #eff0f2; }
  .row { display: flex; gap: .5rem; }
  input, button {
    font: inherit;
    border-radius: 8px;
  }
  input {
    flex: 1;
    min-width: 0;
    padding: .65rem .75rem;
    color: #eff0f4;
    background: #172647;
    border: 1px solid #2f5095;
  }
  input::placeholder { color: #d3d6db; }
  button {
    padding: .65rem .95rem;
    cursor: pointer;
    font-weight: 700;
    color: #172647;
    background: #eff0f2;
    border: 1px solid #eff0f2;
  }
  button:hover { background: #d3d6db; border-color: #d3d6db; }
  :focus-visible { outline: 2px solid #eff0f4; outline-offset: 2px; }
  .suggestions { display: flex; flex-wrap: wrap; gap: .45rem; margin: .75rem 0 0; }
  .suggestions button {
    background: transparent;
    color: #eff0f4;
    border-color: #2f5095;
    font-size: .92rem;
    font-weight: 700;
  }
  .suggestions button:hover { background: #2f5095; border-color: #2f5095; color: #eff0f4; }
  #agent { margin-top: 1.25rem; min-height: 4.5rem; }
  #steps { margin: 0; padding-left: 1.2rem; color: #d3d6db; font-size: .95rem; line-height: 1.5; }
  #steps:empty { display: none; }
  #answer { font-size: 1.05rem; line-height: 1.6; font-weight: 600; margin: .8rem 0 0; color: #eff0f2; }
  #answer:empty { display: none; }
  #action { margin: .8rem 0 0; }
  #action:empty { display: none; }
  a { color: #eff0f4; font-weight: 700; }
  .channel { text-align: center; margin: 1.75rem 0 0; }
  @media (max-width: 520px) {
    .row { flex-direction: column; }
    .mark { width: 3.5rem; height: 3.5rem; }
    .wordmark { font-size: 2.45rem; }
  }
</style>
</head>
<body>
<main>
  <h1 class="logo">
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
      <rect width="64" height="64" rx="15" fill="#d3d6db"/>
      <g fill="#172647">
        <polygon points="14.6,17.2 26.4,16.4 27.1,48.8 15.2,49.6"/>
        <polygon points="38.2,15.6 50.4,16.6 51.1,48.2 39.1,47.4"/>
        <polygon points="20.2,18.8 31.2,17.4 49.4,46.6 38.4,48.4"/>
      </g>
    </svg>
    <span class="wordmark">nazux</span>
  </h1>
  <p class="lede">Plain explainers for remote workers who want a calmer home office.</p>

  <form id="ask-form">
    <label for="ask">Ask for an explainer</label>
    <div class="row">
      <input id="ask" name="ask" autocomplete="off" placeholder="Sunday reset, a quieter desk…">
      <button type="submit">Ask</button>
    </div>
  </form>
  <div class="suggestions">
    <button type="button" data-ask="How do I do a Sunday reset?">Sunday reset</button>
    <button type="button" data-ask="How do I make my desk quieter?">Quieter desk</button>
    <button type="button" data-ask="How should I end the work day?">End the day</button>
    <button type="button" data-ask="Open the YouTube channel">Watch</button>
  </div>

  <section id="agent" aria-live="polite">
    <ol id="steps"></ol>
    <p id="answer"></p>
    <p id="action"></p>
  </section>

  <p class="channel"><a href="https://www.youtube.com/@Nazux-n5e">Watch on YouTube</a></p>
</main>

<script type="application/json" id="nazux-explainers">
[
  {
    "id": "about",
    "title": "What Nazux is",
    "choice": "what Nazux is",
    "keys": ["nazux", "who are you", "what is this", "what are you", "about you"],
    "answer": "Nazux gives plain explainers for remote workers who want a calmer home office. Ask for one, or watch them on YouTube."
  },
  {
    "id": "watch",
    "title": "YouTube channel",
    "choice": "the YouTube channel",
    "keys": ["youtube", "channel", "video", "watch"],
    "answer": "The explainers are on the Nazux YouTube channel.",
    "action": { "label": "Open the channel", "href": "https://www.youtube.com/@Nazux-n5e" }
  },
  {
    "id": "reset",
    "title": "Sunday reset",
    "choice": "the Sunday reset",
    "keys": ["sunday", "reset", "next week", "monday"],
    "answer": "Close one week before you start the next. Clear the desk, write down the three things that matter, and leave Monday a smaller pile."
  },
  {
    "id": "desk",
    "title": "Quieter desk",
    "choice": "the quieter desk",
    "keys": ["desk", "chair", "workspace", "setup", "clutter"],
    "answer": "Keep the desk for the task in front of you. Everything else goes where you can reach it without searching. If you can reset the surface in a minute, it is quiet enough."
  },
  {
    "id": "shutdown",
    "title": "End the day",
    "choice": "the end of the day",
    "keys": ["end the day", "shutdown", "log off", "sign off", "evening", "done for the day", "work day"],
    "answer": "Stop on purpose. Note where you left off, close the extra tabs, and choose the first thing for tomorrow. Then leave the work where it is."
  },
  {
    "id": "focus",
    "title": "A short focus block",
    "choice": "a short focus block",
    "keys": ["focus", "distract", "notification", "deep work", "concentrate"],
    "answer": "Choose one task and quiet the rest for a short block. When the block ends, stand up. The calm is in the stopping, not in a longer day."
  }
]
</script>
<script>
(function () {
  var CHANNEL = "https://www.youtube.com/@Nazux-n5e";
  var explainers = JSON.parse(document.getElementById("nazux-explainers").textContent);
  var form = document.getElementById("ask-form");
  var input = document.getElementById("ask");
  var stepsEl = document.getElementById("steps");
  var answerEl = document.getElementById("answer");
  var actionEl = document.getElementById("action");
  var runId = 0;

  function wait(ms) {
    return new Promise(function (resolve) { setTimeout(resolve, ms); });
  }

  function score(question, keys) {
    return keys.reduce(function (total, key) {
      return total + (question.indexOf(key) !== -1 ? key.length : 0);
    }, 0);
  }

  function choose(question) {
    var best = null;
    var bestScore = 0;
    explainers.forEach(function (explainer) {
      var value = score(question, explainer.keys);
      if (value > bestScore) {
        best = explainer;
        bestScore = value;
      }
    });
    return best;
  }

  function wantsNavigation(question) {
    return /\b(open|go to|take me)\b/.test(question);
  }

  function plan(question) {
    var trimmed = question.trim();
    var normalized = trimmed.toLowerCase();
    if (!normalized) {
      return {
        steps: ["The request was empty.", "Nazux needs a subject before it can explain."],
        answer: "Ask for a Sunday reset, a quieter desk, a short focus block, or how to end the work day.",
        action: null
      };
    }
    var explainer = choose(normalized);
    if (!explainer) {
      return {
        steps: [
          "Read the request.",
          "No Nazux explainer matches it.",
          "Stay with the subjects Nazux actually covers."
        ],
        answer: "I stick to a few explainers: a Sunday reset, a quieter desk, a short focus block, and ending the work day. Ask for one of those, or open the channel.",
        action: { label: "Open the channel", href: CHANNEL }
      };
    }
    var action = explainer.action || null;
    var trace = [
      "Read the request.",
      "Picked " + explainer.choice + "."
    ];
    if (action && wantsNavigation(normalized)) {
      trace.push("Open the channel.");
    } else {
      trace.push("Answer in plain language.");
    }
    return {
      steps: trace,
      answer: explainer.answer,
      action: action,
      navigate: Boolean(action && wantsNavigation(normalized))
    };
  }

  function clearPanel() {
    stepsEl.replaceChildren();
    answerEl.textContent = "";
    actionEl.replaceChildren();
  }

  async function run(question) {
    var current = ++runId;
    var result = plan(question);
    clearPanel();
    for (var i = 0; i < result.steps.length; i++) {
      await wait(280);
      if (current !== runId) return;
      var item = document.createElement("li");
      item.textContent = result.steps[i];
      stepsEl.appendChild(item);
    }
    await wait(280);
    if (current !== runId) return;
    answerEl.textContent = result.answer;
    if (result.action) {
      var link = document.createElement("a");
      link.href = result.action.href;
      link.textContent = result.action.label;
      actionEl.appendChild(link);
    }
    if (result.navigate) {
      await wait(700);
      if (current !== runId) return;
      window.location.assign(result.action.href);
    }
  }

  form.addEventListener("submit", function (event) {
    event.preventDefault();
    run(input.value);
  });

  document.querySelectorAll("[data-ask]").forEach(function (button) {
    button.addEventListener("click", function () {
      input.value = button.getAttribute("data-ask");
      run(input.value);
    });
  });
})();
</script>
</body>
</html>
